spring.application.name=todoapp

# mysql database configuration
# data source url-->  <protocol>:<which database use>://<url of the database><optional:?autoReconnect=true>
spring.datasource.url=jdbc:mysql://localhost:3306/todoapp?autoReconnect=true  
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jpa configuration
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
# for creating schemas and tables automatically
spring.jpa.hibernate.ddl-auto=update
# dialect vaneko spring boot le specific query kasari banauna or decide which or what  kind of sql queries generated
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG