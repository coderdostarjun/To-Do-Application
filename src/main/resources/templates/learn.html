<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tasks</title>

  <!--    include bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<h1 class="text-center text-bg-primary">Todo Application</h1>

<!-- Create Task Form -->
<div class="form-container mt-2 text-center">
  <!--    <h3>Create a New Task</h3>-->
  <form class="d-flex p-4" th:action="@{/api/v1/task/create}" method="post">
    <input class="form-control form-control-lg" type="text" name="title" placeholder="Enter Task Title" required>
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
</div>

<!-- Update Task Form -->
<div class="form-container">
  <h3>Update Task</h3>
  <form th:action="@{/api/v1/task/update}" method="post">
    <input type="number" name="taskId" placeholder="Task ID" required>
    <input type="text" name="title" placeholder="New Task Title" required>
    <button type="submit">Update Task</button>
  </form>
</div>

<!-- Delete Task Form -->
<div class="form-container">
  <h3>Delete Task</h3>
  <form th:action="@{/api/v1/task/delete}" method="post">
    <input type="number" name="taskId" placeholder="Task ID" required>
    <button type="submit">Delete Task</button>
  </form>
</div>

<!-- Fetch Task Form -->
<div class="form-container">
  <h3>Get Task</h3>
  <form th:action="@{/api/v1/task/get}" method="get">
    <input type="number" name="taskId" placeholder="Task ID" required>
    <button type="submit">Get Task</button>
  </form>
  <!--    <h2>Title: <span th:text="${singleTask.title}">Task Title</span></h2>-->
</div>


<!--    // Thymeleaf syntax to loop through a list of tasks and display their title like for eachloop jhai kamaga gareko xa.-->
<div>
  <!--        get allTasks malist of object xana [{},{}]tyo palai palo itrate hudai janxa div tag ma ra tesko title display hunxa object ko properties-->
  <div th:each="task:${getAllTask}">
    <span th:text="${task.title}">Task Title</span>
  </div>
</div>




</body>
</html>
