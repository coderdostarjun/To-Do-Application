<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
<!--    include bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <!-- Heading -->
    <h2 class="fw-bold text-primary text-center">To-Do Application</h2>

    <!-- Task Input Form -->
    <form action="/api/v1/task/create" method="post" class="mt-3">
        <div class="d-flex justify-content-between align-items-center border p-2 rounded shadow-sm">
            <input type="text" class="form-control me-2" name="title" placeholder="Enter task title" required>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>
    </form>

    <!-- Task List Section -->
    <div class="mt-3">
        <div th:each="task : ${getAllTask}" class="card shadow-sm p-3 mb-2 d-flex justify-content-between align-items-center flex-row">
            <span class="fw-bold task-text" th:text="${task.title}"></span>
            <div>
                <!-- Update Button (Strikethrough Toggle) -->
                <button class="btn btn-warning btn-sm me-2 update-btn">Toggle</button>

                <!-- Delete Button -->
                <form th:action="@{/api/v1/task/delete}" method="post" class="d-inline">
                    <input type="hidden" name="taskId" th:value="${task.id}">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toggle strikethrough on update click
    document.querySelectorAll('.update-btn').forEach(button => {
        button.addEventListener('click', function() {
            let taskText = this.closest('.card').querySelector('.task-text');
            taskText.classList.toggle('text-decoration-line-through');
        });
    });
</script>

</body>
</html>
